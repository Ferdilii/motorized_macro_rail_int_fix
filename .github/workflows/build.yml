name: Build Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Setup C++ and CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3

    - name: Setup Pico SDK
      run: |
        git clone -b master https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=$(pwd)" >> $GITHUB_ENV

    - name: Build Project
      run: |
        cd src
        mkdir build
        cd build
        cmake ..
        make

    - name: Upload UF2 File
      uses: actions/upload-artifact@v3
      with:
        name: motorized_macro_rail_firmware
        path: src/build/*.uf2
